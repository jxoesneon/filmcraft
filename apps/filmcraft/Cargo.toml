[package]
name = "filmcraft"
description = "FilmCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "filmcraft"
build = "build.rs"

[lints]
workspace = true

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-ui-martensite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Icon + VERSIONINFO for filmcraft.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/filmcraft", dest = "/usr/bin/filmcraft", mode = "755" }
]
